<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3B82F6',
                        secondary: '#10B981',
                        accent: '#F59E0B',
                        dark: '#1E293B',
                        light: '#F8FAFC'
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .calc-btn {
                @apply w-full h-14 rounded-lg flex items-center justify-center text-xl font-medium transition-all duration-200 active:scale-95;
            }
            .number-btn {
                @apply bg-gray-200 text-gray-800 hover:bg-gray-300;
            }
            .operator-btn {
                @apply bg-primary text-white hover:bg-primary/90;
            }
            .special-btn {
                @apply bg-red-500 text-white hover:bg-red-600;
            }
            .display {
                @apply w-full p-4 text-right rounded-lg mb-4 font-mono bg-gray-100 text-gray-900 h-24;
            }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-50 to-indigo-100">
    <div class="calculator-container w-full max-w-md p-6 bg-white rounded-2xl shadow-xl">
        <h1 class="text-2xl font-bold text-gray-800 mb-4">Basic Calculator</h1>
        
        <!-- Display area -->
        <div class="display">
            <div id="display" class="text-3xl md:text-4xl h-18 overflow-x-auto whitespace-nowrap"></div>
        </div>
        
        <!-- Keypad (only basic functions) -->
        <div class="grid grid-cols-4 gap-2">
            <!-- Control buttons -->
            <button class="special-btn" data-action="clear">C</button>
            <button class="special-btn" data-action="backspace">
                <i class="fa fa-backspace"></i>
            </button>
            <button class="operator-btn" data-action="percent">%</button>
            <button class="operator-btn" data-action="/">÷</button>
            
            <!-- Number buttons -->
            <button class="number-btn" data-number="7">7</button>
            <button class="number-btn" data-number="8">8</button>
            <button class="number-btn" data-number="9">9</button>
            <button class="operator-btn" data-action="*">×</button>
            
            <button class="number-btn" data-number="4">4</button>
            <button class="number-btn" data-number="5">5</button>
            <button class="number-btn" data-number="6">6</button>
            <button class="operator-btn" data-action="-">-</button>
            
            <button class="number-btn" data-number="1">1</button>
            <button class="number-btn" data-number="2">2</button>
            <button class="number-btn" data-number="3">3</button>
            <button class="operator-btn" data-action="+">+</button>
            
            <button class="number-btn" data-action="toggle-sign">±</button>
            <button class="number-btn" data-number="0">0</button>
            <button class="number-btn" data-number=".">.</button>
            <button class="operator-btn" data-action="=">=</button>
        </div>
    </div>

    <script>
        // DOM Elements
        const display = document.getElementById('display');
        
        // Calculator state
        let currentValue = '';
        let previousValue = '';
        let operator = null;
        
        // Initialize display
        updateDisplay();
        
        // Number button event listeners
        document.querySelectorAll('[data-number]').forEach(button => {
            button.addEventListener('click', () => {
                const number = button.getAttribute('data-number');
                if (number === '.' && currentValue.includes('.')) return; // Prevent multiple decimals
                currentValue += number;
                updateDisplay();
            });
        });
        
        // Action button event listeners
        document.querySelectorAll('[data-action]').forEach(button => {
            button.addEventListener('click', () => {
                const action = button.getAttribute('data-action');
                switch (action) {
                    case '=':
                        calculate();
                        break;
                    case 'clear':
                        clearAll();
                        break;
                    case 'backspace':
                        backspace();
                        break;
                    case 'toggle-sign':
                        toggleSign();
                        break;
                    case 'percent':
                        calculatePercent();
                        break;
                    default:
                        setOperator(action);
                }
            });
        });
        
        // Update display
        function updateDisplay() {
            display.textContent = currentValue || '0';
        }
        
        // Set operator
        function setOperator(op) {
            if (currentValue === '' && previousValue === '') return;
            if (previousValue !== '' && currentValue !== '') calculate();
            operator = op;
            previousValue = currentValue || previousValue;
            currentValue = '';
        }
        
        // Get operator symbol
        function getOperatorSymbol(op) {
            const symbols = { '+': '+', '-': '-', '*': '×', '/': '÷' };
            return symbols[op] || op;
        }
        
        // Calculate result
        function calculate() {
            if (!operator || currentValue === '' || previousValue === '') return;
            const prev = parseFloat(previousValue);
            const curr = parseFloat(currentValue);
            let result;
            
            try {
                switch (operator) {
                    case '+': result = prev + curr; break;
                    case '-': result = prev - curr; break;
                    case '*': result = prev * curr; break;
                    case '/': 
                        if (curr === 0) { alert('Cannot divide by zero'); return; }
                        result = prev / curr; 
                        break;
                    default: return;
                }
                // Format result
                result = Number.isInteger(result) ? result : parseFloat(result.toFixed(8));
                currentValue = result.toString();
                previousValue = '';
                operator = null;
                updateDisplay();
            } catch (error) {
                display.textContent = 'Error';
            }
        }
        
        // Clear all
        function clearAll() {
            currentValue = '';
            previousValue = '';
            operator = null;
            updateDisplay();
        }
        
        // Backspace
        function backspace() {
            currentValue = currentValue.slice(0, -1);
            updateDisplay();
        }
        
        // Toggle sign
        function toggleSign() {
            if (currentValue === '') return;
            currentValue = currentValue.startsWith('-') ? currentValue.slice(1) : '-' + currentValue;
            updateDisplay();
        }
        
        // Calculate percentage
        function calculatePercent() {
            if (currentValue === '') return;
            currentValue = (parseFloat(currentValue) / 100).toString();
            updateDisplay();
        }
        
        // Basic keyboard support
        document.addEventListener('keydown', (e) => {
            if (/[0-9]/.test(e.key)) {
                e.preventDefault();
                currentValue += e.key;
                updateDisplay();
            }
            if (e.key === '.' && !currentValue.includes('.')) {
                e.preventDefault();
                currentValue += '.';
                updateDisplay();
            }
            if (['+', '-', '*', '/'].includes(e.key)) {
                e.preventDefault();
                setOperator(e.key);
            }
            if (e.key === '=' || e.key === 'Enter') {
                e.preventDefault();
                calculate();
            }
            if (e.key === 'Escape') {
                e.preventDefault();
                clearAll();
            }
            if (e.key === 'Backspace') {
                e.preventDefault();
                backspace();
            }
        });
    </script>
</body>
</html>
